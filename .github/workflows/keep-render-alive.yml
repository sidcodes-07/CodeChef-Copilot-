name: Keep Render service active

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_HEALTH_URL: https://codechef-copilot-api.onrender.com
        run: |
          if [ https://codechef-copilot-api.onrender.com]; then
            echo "Set the repository variable RENDER_HEALTH_URL to your Render service health URL."
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 20 \
            "https://codechef-copilot-api.onrender.com"
